# ~/.config/hypr/hyprsunset.conf
#
# hyprsunset reads this on launch and applies whichever profile's
# `time` has most recently passed. After that, control it live via
# `hyprctl hyprsunset temperature <K>` / `hyprctl hyprsunset identity`
# (which is exactly what the Night Light toggle in your bar does) -
# this file just sets the defaults it starts from / falls back to.

max-gamma = 150

# Daytime: no filter
